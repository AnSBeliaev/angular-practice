<button
  type="button"
  [class.is-selected]="selected()"
  [style.font-weight]="selected() ? 700 : 400"
  (click)="choose()"
>
  <span data-testid="task-title">{{ task().title }}</span>
  @switch (task().status) {
    @case ('open') {
      <span class="status open">открыта</span>
    }
    @case ('done') {
      <span class="status done">готово</span>
    }
    @case ('blocked') {
      <span class="status blocked">блок</span>
    }
  }
</button>
